<style>
/* Layout: control-room console. Status rail on top, workspace (graph | explorer) left, chat column right; stacks on phones. Deliberately dark-only. */
:root {
  --page: #0c0e10;
  --panel: #15181b;
  --raised: #1d2125;
  --line: #262b30;
  --line-2: #343a41;
  --ink: #eceeef;
  --ink-2: #b9bfc5;
  --muted: #7f878f;
  --accent: #3b8be6;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --font: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.app { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 20px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.brand svg { color: var(--accent); }
.demo-pill { font-size: 11px; color: var(--warning); border: 1px solid rgba(250,178,25,.45); border-radius: 999px; padding: 1px 8px; font-weight: 500; }
.stats { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; min-width: 0; }
.stat { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat-value { font-weight: 500; font-variant-numeric: tabular-nums; }
.led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--good); box-shadow: 0 0 6px var(--good); }
.led.bad { background: var(--critical); box-shadow: 0 0 6px var(--critical); }
#spark { width: 96px; height: 26px; display: block; }
.fault-btn { display: flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.fault-btn:hover { border-color: var(--critical); }
.fault-wrap { position: relative; }
.fault-menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; z-index: 20; width: 280px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.fault-menu button { text-align: left; background: none; border: none; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
.fault-menu button:hover { background: var(--raised); }

.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.tabs button { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--raised); border-color: var(--line-2); color: var(--ink); }
.tabs { flex-wrap: wrap; }
.tabs .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.graph-tools { display: flex; gap: 8px; align-items: center; }
#tree-tools { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.search.tree-filter { margin: 0; padding: 4px 8px; width: 250px; max-width: 100%; }
.view { flex: 1; min-height: 0; position: relative; }
#view-graph:not([hidden]) { display: flex; }
.graph-main { position: relative; flex: 1; min-width: 0; }
.cards { flex: none; width: 360px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-left: 1px solid var(--line); min-height: 0; }
.cards[hidden] { display: none; }
.cards-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cards-head .btns { display: flex; gap: 6px; }
.cards-head .btn { padding: 3px 9px; font-size: 11.5px; white-space: nowrap; }
.cards-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.card { flex: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink-2); word-break: break-all; }
.card-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .v.bad { color: var(--critical); }
.card .seg button { padding: 2px 8px; font-size: 11px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; }
.card-foot .btn.mini { padding: 2px 8px; font-size: 11px; }
.card .state-timeline { padding: 4px 0; gap: 6px; }
.card .st-label { display: none; }
.toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.zoom-controls { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; }
.zoom-controls button { background: none; border: none; color: var(--ink-2); border-radius: 6px; padding: 2px 8px; font-size: 13px; min-width: 26px; }
.zoom-controls button:hover:not(:disabled) { background: var(--raised); color: var(--ink); }
.zoom-controls button:disabled { opacity: .35; cursor: default; }
.zoom-controls .reset.on { color: var(--accent); }
.zoom-controls .zoom-range { padding: 0 6px; }
.zoom-controls.compact { align-self: flex-start; border: none; padding: 0; }
.gap-summary { color: var(--good); } .gap-summary.bad { color: #e66767; }
.json-view { margin: 4px 0; padding: 8px 10px; background: var(--page); border: 1px solid var(--line); border-radius: 8px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.45; color: var(--ink-2); max-height: 340px; overflow: auto; white-space: pre; }
.json-view .j-key { color: #9ec5f4; } .json-view .j-str { color: #8fd3b6; } .json-view .j-num { color: #f0c674; } .json-view .j-lit { color: #e598b8; }
@media (max-width: 900px) { #view-graph:not([hidden]) { flex-direction: column; } .cards { width: auto; max-height: 45%; border-left: none; border-top: 1px solid var(--line); } }

/* Graph */
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--ink-2); background: rgba(21,24,27,.9); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); max-width: calc(100% - 24px); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hover-card { position: absolute; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; max-width: min(360px, calc(100% - 24px)); pointer-events: none; }
.hover-card .v { font-size: 20px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.detail { position: absolute; right: 12px; top: 12px; width: 360px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.detail-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; word-break: break-all; }
.detail .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.detail .v.bad { color: var(--critical); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.btn:hover { border-color: var(--accent); }
.icon-btn { background: none; border: none; color: var(--muted); padding: 4px; border-radius: 6px; line-height: 0; }
.icon-btn:hover { color: var(--ink); background: var(--raised); }

/* Explorer */
.explorer { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); }
.tree-col { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { display: flex; align-items: center; gap: 6px; margin: 10px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 8px; color: var(--muted); }
.search input { background: none; border: none; outline: none; color: var(--ink); flex: 1; font: inherit; min-width: 0; }
#tree { overflow-y: auto; flex: 1; padding-bottom: 12px; }
.row { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); border: none; background: none; width: 100%; text-align: left; }
.row:hover { background: var(--raised); }
.row.picked { background: rgba(59,139,230,.12); }
.row.branch { color: var(--ink); font-weight: 500; }
.row .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--line-2); flex: none; }
.row .chev { width: 10px; flex: none; color: var(--muted); font-size: 10px; }
.row .val { margin-left: auto; font: 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .val.bad { color: var(--critical); }
.row.text-topic { cursor: default; }
.chart-col { padding: 12px 16px; min-width: 0; overflow-y: auto; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: none; padding: 5px 12px; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
.state-timeline { display: flex; flex-direction: column; gap: 12px; padding: 10px 4px; }
.st-row { display: flex; flex-direction: column; gap: 4px; }
.st-label { color: var(--ink-2); }
.st-track { position: relative; height: 22px; background: var(--panel-2, #1d2125); border-radius: 4px; overflow: hidden; }
.st-seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--page); }
.st-empty { position: absolute; inset: 0; display: grid; place-items: center; }
.st-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); }
.st-legend span { display: inline-flex; align-items: center; gap: 5px; }
.st-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.st-axis { display: flex; justify-content: space-between; }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .unit { font-size: 11px; color: var(--muted); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); margin: 2px 0 10px 40px; }
.chart-legend span { display: flex; align-items: center; gap: 6px; }
.chart-legend i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 5; }
.tip .t { color: var(--muted); margin-bottom: 2px; }
.tip div span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* Chat */
.chat { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chat-head .title { font-weight: 600; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.suggest { display: flex; flex-direction: column; gap: 8px; }
.suggest button { text-align: left; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.suggest button:hover { border-color: var(--accent); }
.notice { font-size: 12.5px; color: var(--ink-2); background: rgba(250,178,25,.08); border: 1px solid rgba(250,178,25,.35); border-radius: 8px; padding: 8px 10px; }
.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px 12px 4px 12px; padding: 8px 12px; }
.md { min-width: 0; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md h1, .md h2, .md h3 { font-size: 14px; margin: 10px 0 6px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--raised); padding: 1px 4px; border-radius: 4px; }
.md .tbl { overflow-x: auto; margin-bottom: 8px; }
.md table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.md th, .md td { border: 1px solid var(--line-2); padding: 3px 6px; text-align: left; }
.chip { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font: 11px var(--mono); color: var(--muted); background: var(--page); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; max-width: 100%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.done::before { content: "✓"; color: var(--good); }
.chip.bad { border-color: var(--critical); }
.chip.run::before { content: ""; width: 8px; height: 8px; border: 1.5px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
.chat-chart { background: var(--page); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 0; }
.chat-chart .title { font-size: 12px; font-weight: 500; margin: 0 0 4px 4px; }
.thinking { color: var(--muted); font-size: 13px; }
.err { color: #e66767; font-size: 12.5px; }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.composer textarea { flex: 1; resize: none; background: var(--page); border: 1px solid var(--line-2); border-radius: 10px; color: var(--ink); padding: 8px 10px; font: inherit; outline: none; min-width: 0; }
.composer textarea:focus { border-color: var(--accent); }
.send { width: 36px; height: 36px; align-self: flex-end; border-radius: 50%; border: none; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { background: var(--line-2); color: var(--muted); cursor: not-allowed; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .chip.run::before { animation: none; } }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .workspace { height: 72vh; }
  .chat { height: 85vh; border-left: none; border-top: 1px solid var(--line); }
  .explorer { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42% 58%; }
  .tree-col { border-right: none; border-bottom: 1px solid var(--line); }
  .tabs .hint { display: none; }
  .stats { gap: 10px 18px; order: 3; flex-basis: 100%; }
  .fault-wrap { margin-left: auto; }
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      Broker ChatBot <span class="demo-pill">Demo</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="led"></span><div><div class="stat-label">Broker</div><div class="stat-value mono small">sim://acme-dublin</div></div></div>
      <div class="stat"><div><div class="stat-label">Topics</div><div class="stat-value" id="st-topics">0</div></div></div>
      <div class="stat"><div><div class="stat-label">Msgs/s</div><div class="stat-value" id="st-mps">0</div></div><svg id="spark" aria-hidden="true"></svg></div>
      <div class="stat"><div><div class="stat-label">History</div><div class="stat-value" id="st-hist">0 min</div></div></div>
      <div class="stat" id="st-alarm-wrap"><span class="led" id="st-alarm-led"></span><div><div class="stat-label">Alarms</div><div class="stat-value" id="st-alarms">None</div></div></div>

    <div class="fault-wrap">
      <button class="fault-btn" id="fault-btn" aria-haspopup="true" aria-expanded="false">⚡ Inject fault</button>
      <div class="fault-menu" id="fault-menu" hidden></div>

  <div class="main">
    <section class="workspace">
      <nav class="tabs" role="tablist">

        <button role="tab" id="tab-explorer" aria-selected="false">☰ Explorer &amp; trends</button>

          <span id="tree-tools" hidden><button class="btn" id="expand-all">Expand all</button> <button class="btn" id="collapse-all">Collapse all</button></span>
        </div>

      <div class="view" id="view-graph">
        <div class="graph-main" id="graph-main">

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * Mock ISA-95 / UNS plant: acme/dublin/<area>/<line>/<cell>/<tag>.
 * Runs on a virtual clock so we can backfill 3 hours of history at load.
 * ------------------------------------------------------------------ */
const ROOT = "acme/dublin";
const RETENTION_MS = 180 * 60_000;
const rand = (a, b) => a + Math.random() * (b - a);
const noise = (n) => (Math.random() - 0.5) * 2 * n;
const round = (v, dp = 2) => Math.round(v * 10 ** dp) / 10 ** dp;
const wave = (ts, periodS, phase = 0) => Math.sin((2 * Math.PI * ts) / (periodS * 1000) + phase);
class Lag { constructor(v, k = 0.15) { this.v = v; this.k = k; } step(target, dt = 1) { this.v += (target - this.v) * (1 - Math.pow(1 - this.k, dt)); return this.v; } }

const FAULTS = [
  ["Filler motor overheating (line 2)", "packaging/line2/filler/motor_temp"],
  ["Labeler web break, line 1 down", "packaging/line1/state"],
  ["Compressor 2 trip, air pressure dropping", "utilities/compressed_air/compressor2"],
  ["Oven zone 2 temperature overshoot", "processing/oven1/zone2"],
  ["Mixer 1 high motor current", "processing/mixer1/motor_current"],
  ["Capper torque drift (line 2), rejects rising", "packaging/line2/capper/torque"],
  ["Filler motor overheating (line 3)", "packaging/line3/filler/motor_temp"],
  ["Labeler web break, line 4 down", "packaging/line4/state"],
];

class Plant {
  constructor(start) {
    this.tags = [];
    this.faults = [];
    this.updaters = [];
    this.lineStates = new Map();
    this.now = start;
    this.nextFaultAt = start + rand(600, 1200) * 1000;
    this.site();
    this.packaging("line1", 120, 0);
    this.packaging("line2", 100, 1.3);
    this.packaging("line3", 150, 2.4);
    this.packaging("line4", 90, 3.7);
    this.mixer("mixer1", 0);
    this.mixer("mixer2", 2.1);
    this.oven();
    this.cip();
    this.utilities();
  }
  add(topic, read, unit, every = 2, retain = false, drop) { this.tags.push({ topic: `${ROOT}/${topic}`, read, unit, every, retain, drop }); }
  fault(key) { return this.faults.find((f) => f.until > this.now && key.startsWith(f.key)); }
  inject(name, key, seconds = rand(150, 300)) {
    this.faults.push({ name, key, from: this.now, until: this.now + seconds * 1000 });
  }
  /** Advance internal state by dt seconds to time `now`. */
  advance(now, dt, autoFaults = true) {
    this.now = now;
    this.faults = this.faults.filter((f) => f.until > now);
    if (autoFaults && now >= this.nextFaultAt) {
      const [name, key] = FAULTS[Math.floor(Math.random() * FAULTS.length)];
      this.inject(name, key);
      this.nextFaultAt = now + rand(600, 1200) * 1000;
    }
    for (const u of this.updaters) u(now, dt);
  }

  site() {
    this.add("shift", (n) => { const h = new Date(n).getHours(); return h >= 6 && h < 14 ? "A" : h >= 14 && h < 22 ? "B" : "C"; }, undefined, 30, true);
    this.add("headcount", () => 42 + Math.round(noise(3)), "people", 60, true);
    this.add("environment/ambient_temp", (n) => round(18 + 3 * wave(n, 3600) + noise(0.2)), "°C", 10);
    this.add("environment/humidity", (n) => round(55 + 8 * wave(n, 5400, 1) + noise(0.5)), "%RH", 10);
  }

  packaging(line, rated, phase) {
    const base = `packaging/${line}`;
    // Start mid-shift (6 h in) so OEE doesn't open on a warm-up spike.
    const s = { state: "Running", until: this.now + rand(300, 1500) * 1000, alarm: "none", good: rand(8000, 20000), reject: 0, total: 21600, running: 21600 * 0.86, runSpeed: 0 };
    s.runSpeed = s.running * rated * 0.93;
    s.reject = s.good * 0.012;
    const speed = new Lag(rated * 0.95, 0.25);
    const temps = { filler: new Lag(55, 0.05), capper: new Lag(48, 0.05), labeler: new Lag(45, 0.05), palletizer: new Lag(42, 0.05) };
    const normal = { filler: 55, capper: 48, labeler: 45, palletizer: 42 };
    this.updaters.push((now, dt) => {
      const jam = this.fault(`${base}/state`);
      if (jam && s.state !== "Down") { s.state = "Down"; s.alarm = "E-214 Labeler web break"; s.until = jam.until; }
      else if (now > s.until) {
        if (s.state === "Running") {
          const r = Math.random();
          s.state = r < 0.5 ? "Idle" : r < 0.8 ? "Down" : "Changeover";
          s.alarm = s.state === "Down" ? ["E-101 Bottle infeed starved", "E-330 Capper chute blocked", "E-502 Guard door open"][Math.floor(Math.random() * 3)] : "none";
          s.until = now + rand(60, s.state === "Changeover" ? 900 : 360) * 1000;
        } else { s.state = "Running"; s.alarm = "none"; s.until = now + rand(900, 2400) * 1000; }
      }
      this.lineStates.set(line, s.state);
      speed.step(s.state === "Running" ? rated * (0.92 + 0.05 * wave(now, 900, phase)) : 0, dt);
      s.total += dt;
      if (s.state === "Running") { s.running += dt; s.runSpeed += speed.v * dt; }
      const made = (speed.v / 60) * dt;
      const rr = this.fault(`${base}/capper/torque`) ? 0.06 : 0.012;
      s.good += made * (1 - rr); s.reject += made * rr;
      const rf = s.state === "Running" ? 1 : 0.2;
      for (const c of Object.keys(temps)) temps[c].step(normal[c] * (0.75 + 0.25 * rf) + (this.fault(`${base}/${c}/motor_temp`) ? 38 : 0), dt);
    });
    const avail = () => (s.total ? s.running / s.total : 1);
    const perf = () => (s.running ? Math.min(1, s.runSpeed / (s.running * rated)) : 0.95);
    const qual = () => s.good / (s.good + s.reject);
    const run = () => s.state === "Running";
    this.add(`${base}/state`, () => s.state, undefined, 2, true);
    this.add(`${base}/alarm/active`, () => s.alarm, undefined, 5, true);
    this.add(`${base}/speed`, () => round(speed.v + (run() ? noise(0.8) : 0), 1), "bpm", 1);
    this.add(`${base}/good_count`, () => Math.round(s.good), "units", 2);
    this.add(`${base}/reject_count`, () => Math.round(s.reject), "units", 2);
    this.add(`${base}/oee/availability`, () => round(avail() * 100, 1), "%", 10);
    this.add(`${base}/oee/performance`, () => round(perf() * 100, 1), "%", 10);
    this.add(`${base}/oee/quality`, () => round(qual() * 100, 1), "%", 10);
    this.add(`${base}/oee/oee`, () => round(avail() * perf() * qual() * 100, 1), "%", 10);
    const mt = (c) => (n) => round(temps[c].v + 2 * wave(n, 600, phase) + noise(0.3), 1);
    this.add(`${base}/filler/fill_weight`, () => round(run() ? 500 + noise(2.5) : 0, 1), "g", 1);
    this.add(`${base}/filler/nozzle_pressure`, (n) => round(2.4 + 0.1 * wave(n, 120) + noise(0.03), 2), "bar", 2);
    this.add(`${base}/filler/motor_temp`, mt("filler"), "°C", 2);
    this.add(`${base}/filler/motor_current`, () => round(12 * (run() ? 1 : 0.2) + noise(0.4), 1), "A", 2);
    // Filler counters with a per-message sequence number. Some messages are lost on purpose: about 1% at random,
    // plus a network blip every 8-20 minutes that drops everything for 5-30 s. Counters and seq keep counting,
    // so the losses show up as jumps in seq.
    const fc = { seq: Math.floor(rand(10_000, 90_000)), filled: s.good + s.reject + rand(500, 2000), rejects: 0, last: 0, blipFrom: this.now + rand(120, 900) * 1000, blipUntil: 0 };
    fc.rejects = fc.filled * 0.004;
    const lost = () => {
      if (this.now >= fc.blipFrom) { fc.blipUntil = this.now + rand(5, 30) * 1000; fc.blipFrom = fc.blipUntil + rand(480, 1200) * 1000; }
      return this.now < fc.blipUntil || Math.random() < 0.01;
    };
    this.add(`${base}/filler/counts`, (n) => {
      const dt = fc.last ? (n - fc.last) / 1000 : 0;
      fc.last = n;
      const made = (speed.v / 60) * dt;
      fc.filled += made;
      fc.rejects += made * (this.fault(`${base}/filler/motor_temp`) ? 0.02 : 0.004);
      const total = Math.round(fc.filled), rejects = Math.round(fc.rejects);
      return { seq: ++fc.seq, good_count: total - rejects, reject_count: rejects, total_count: total, state: run() ? "Filling" : "Stopped" };
    }, undefined, 1, false, lost);
    this.add(`${base}/capper/torque`, (n) => round((this.fault(`${base}/capper/torque`) ? 1.6 + 0.4 * wave(n, 60) : 2.2) + noise(0.05), 2), "Nm", 2);
    this.add(`${base}/capper/motor_temp`, mt("capper"), "°C", 2);
    this.add(`${base}/capper/cap_hopper_level`, (n) => round(60 + 35 * wave(n, 1500, phase) + noise(1), 0), "%", 5);
    this.add(`${base}/labeler/web_tension`, () => round(run() ? 85 + noise(3) : 20 + noise(1), 1), "N", 2);
    this.add(`${base}/labeler/motor_temp`, mt("labeler"), "°C", 2);
    this.add(`${base}/labeler/label_roll_remaining`, (n) => round(100 - ((n / 20000) % 100), 0), "%", 10);
    this.add(`${base}/palletizer/pallet_count`, () => Math.floor(s.good / 1200), "pallets", 5);
    this.add(`${base}/palletizer/layer`, () => Math.floor((s.good % 1200) / 150) + 1, undefined, 5);
    this.add(`${base}/palletizer/motor_temp`, mt("palletizer"), "°C", 2);

    // Nested JSON: the MES work order running on the line.
    const products = {
      line1: [["CL-330", "Cola 330ml can"], ["CL-500", "Cola 500ml PET"]],
      line2: [["LM-330", "Lemon 330ml can"], ["OR-1L", "Orange 1L PET"]],
      line3: [["WT-500", "Still water 500ml PET"], ["SP-500", "Sparkling water 500ml PET"]],
      line4: [["EN-250", "Energy 250ml can"], ["IT-330", "Iced tea 330ml glass"]],
    }[line];
    const operator = { line1: "A. Byrne", line2: "C. Murphy", line3: "D. O'Neill", line4: "R. Quinn" }[line];
    const wo = { id: 24100 + Math.floor(rand(0, 50)), start: s.good - rand(2000, 9000), target: 24000, product: 0, last: s.state };
    this.updaters.push(() => {
      if (wo.last === "Changeover" && s.state !== "Changeover") {
        wo.id++; wo.start = s.good; wo.target = [12000, 24000, 36000][Math.floor(Math.random() * 3)]; wo.product = (wo.product + 1) % products.length;
      }
      wo.last = s.state;
    });
    this.add(`${base}/mes/work_order`, (n) => {
      const produced = Math.round(s.good - wo.start);
      const h = new Date(n).getHours();
      return {
        order: { id: `WO-${wo.id}`, status: s.state === "Changeover" ? "Changeover" : produced >= wo.target ? "Complete" : "In Progress" },
        product: { sku: products[wo.product][0], name: products[wo.product][1], batch_size: wo.target },
        progress: { produced, remaining: Math.max(0, wo.target - produced), percent: round(Math.min(100, (produced / wo.target) * 100), 1) },
        operator: { name: operator, shift: h >= 6 && h < 14 ? "A" : h >= 14 && h < 22 ? "B" : "C" },
        line_state: s.state,
      };
    }, undefined, 5, true);

    if (line === "line2") {
      // Nested JSON: the palletizer robot's controller snapshot, three levels deep.
      const ax = [new Lag(38, 0.05), new Lag(41, 0.05), new Lag(36, 0.05)];
      this.updaters.push((now, dt) => { const rf = run() ? 1 : 0; ax[0].step(38 + 4 * rf, dt); ax[1].step(41 + 5 * rf, dt); ax[2].step(36 + 3 * rf, dt); });
      this.add(`${base}/palletizer/robot`, (n) => {
        const holding = run() && Math.floor(n / 1000) % 8 < 4;
        const axis = (i, torque) => ({ temp: { value: round(ax[i].v + wave(n, 300 + 60 * i) + noise(0.2), 1), unit: "°C" }, torque_pct: round(torque * (run() ? 1 : 0.1) + noise(2), 1) });
        return {
          controller: { mode: run() ? "Auto" : "Manual", program: "P-LAYER-6", cycle_time_s: round(run() ? 8.4 + noise(0.3) : 0, 2) },
          axes: { a1: axis(0, 45), a2: axis(1, 62), a3: axis(2, 30) },
          gripper: { state: holding ? "Holding" : "Open", vacuum_kpa: round(holding ? -62 + noise(1.5) : -2 + noise(0.5), 1) },
          safety: { fence_closed: !(s.state === "Down" && s.alarm.includes("Guard")), estop: false },
        };
      }, undefined, 2);
    }
  }

  mixer(name, phase) {
    const base = `processing/${name}`;
    const phases = ["Charging", "Mixing", "Heating", "Holding", "Discharging", "CIP"];
    const durs = [180, 420, 300, 240, 180, 240];
    const cycle = durs.reduce((a, b) => a + b, 0);
    const offset = rand(0, cycle) * 1000;
    const temp = new Lag(25, 0.04), level = new Lag(20, 0.05);
    const at = (n) => {
      const k = Math.floor((n + offset) / 1000 / cycle);
      let x = ((n + offset) / 1000) % cycle, i = 0;
      while (x > durs[i]) x -= durs[i++];
      return { phase: phases[i], batch: 2400 + (k % 600) };
    };
    const rpm = (p) => ({ Mixing: 180, Heating: 120, Holding: 60, Charging: 30, Discharging: 40, CIP: 90 })[p];
    this.updaters.push((now, dt) => {
      const p = at(now).phase;
      level.step(p === "Charging" ? 85 : p === "Discharging" || p === "CIP" ? 5 : level.v, dt);
      temp.step(p === "Heating" || p === "Holding" ? 72 : p === "CIP" ? 60 : 25, dt);
    });
    this.add(`${base}/state`, (n) => (at(n).phase === "CIP" ? "Cleaning" : "Running"), undefined, 5, true);
    this.add(`${base}/batch/id`, (n) => `B-${at(n).batch}`, undefined, 10, true);
    this.add(`${base}/batch/phase`, (n) => at(n).phase, undefined, 2, true);
    this.add(`${base}/speed`, (n) => round(rpm(at(n).phase) + noise(2), 0), "rpm", 1);
    this.add(`${base}/motor_current`, (n) => round(rpm(at(n).phase) * 0.09 + (this.fault(`${base}/motor_current`) ? 9 : 0) + noise(0.3), 1), "A", 2);
    this.add(`${base}/motor_temp`, (n) => round(45 + rpm(at(n).phase) * 0.05 + 2 * wave(n, 700, phase) + noise(0.3), 1), "°C", 2);
    this.add(`${base}/tank_level`, () => round(level.v + noise(0.3), 1), "%", 2);
    this.add(`${base}/product_temp`, () => round(temp.v + noise(0.2), 1), "°C", 2);
    // Nested JSON: the batch record from the batch engine, with setpoints next to actuals.
    this.add(`${base}/batch/record`, (n) => {
      const { phase: p, batch } = at(n);
      return {
        batch: { id: `B-${batch}`, recipe: name === "mixer1" ? "Syrup base v3" : "Citrus concentrate v7", phase: p, step: phases.indexOf(p) + 1, of_steps: phases.length },
        setpoints: { temperature: { value: p === "Heating" || p === "Holding" ? 72 : p === "CIP" ? 60 : 25, unit: "°C" }, speed: { value: rpm(p), unit: "rpm" } },
        actuals: { temperature: { value: round(temp.v, 1), unit: "°C" }, speed: { value: round(rpm(p) + noise(2), 0), unit: "rpm" }, level: { value: round(level.v, 1), unit: "%" } },
        quality: { brix: round(p === "Holding" || p === "Discharging" ? 11.2 + noise(0.15) : 0, 2), ph: round(3.2 + noise(0.05), 2), sample_status: p === "Holding" ? "Pending lab" : p === "Discharging" ? "Released" : "Not sampled" },
        operator: name === "mixer1" ? "M. Walsh" : "S. Kelly",
      };
    }, undefined, 5);
  }

  oven() {
    const base = "processing/oven1";
    const sps = [180, 210, 195];
    const zones = sps.map((sp) => new Lag(sp, 0.06));
    this.updaters.push((now, dt) => sps.forEach((sp, i) => zones[i].step(sp + (this.fault(`${base}/zone${i + 1}`) ? 28 : 0), dt)));
    this.add(`${base}/state`, () => "Running", undefined, 10, true);
    sps.forEach((sp, i) => {
      this.add(`${base}/zone${i + 1}/temperature`, (n) => round(zones[i].v + 1.5 * wave(n, 240, i) + noise(0.4), 1), "°C", 1);
      this.add(`${base}/zone${i + 1}/setpoint`, () => sp, "°C", 30, true);
    });
    this.add(`${base}/belt_speed`, (n) => round(1.8 + 0.05 * wave(n, 1800) + noise(0.01), 2), "m/min", 2);
    this.add(`${base}/gas_flow`, (n) => round(42 + 4 * wave(n, 300) + (this.fault(`${base}/zone2`) ? 9 : 0) + noise(0.5), 1), "m³/h", 2);
    this.add(`${base}/exhaust_temp`, (n) => round(140 + 5 * wave(n, 400) + noise(0.6), 1), "°C", 5);
  }

  cip() {
    const base = "processing/cip";
    const on = () => [...this.lineStates.values()].includes("Changeover");
    this.add(`${base}/state`, () => (on() ? "Washing" : "Idle"), undefined, 5, true);
    this.add(`${base}/supply_temp`, () => round(on() ? 78 + noise(0.8) : 30 + noise(0.3), 1), "°C", 2);
    this.add(`${base}/conductivity`, () => round(on() ? 85 + noise(3) : 0.5 + noise(0.05), 2), "mS/cm", 2);
    this.add(`${base}/flow`, () => round(on() ? 12 + noise(0.4) : 0, 1), "m³/h", 2);
  }

  utilities() {
    const base = "utilities";
    const pressure = new Lag(7.2, 0.1);
    const load = () => [...this.lineStates.values()].filter((x) => x === "Running").length * 140 + 220;
    let kwh = 1_250_000, water = 84_000;
    this.updaters.push((now, dt) => {
      pressure.step(7.2 - (this.fault(`${base}/compressed_air/compressor2`) ? 1.6 : 0), dt);
      kwh += (load() * dt) / 3600;
      water += (18 * dt) / 3600;
    });
    for (const c of ["compressor1", "compressor2"]) {
      const trip = () => !!this.fault(`${base}/compressed_air/${c}`);
      this.add(`${base}/compressed_air/${c}/state`, () => (trip() ? "Tripped" : "Running"), undefined, 5, true);
      this.add(`${base}/compressed_air/${c}/power`, (n) => round(trip() ? 0 : 55 + 6 * wave(n, 200) + noise(1), 1), "kW", 2);
      this.add(`${base}/compressed_air/${c}/motor_temp`, (n) => round(trip() ? 35 : 68 + 2 * wave(n, 500) + noise(0.4), 1), "°C", 5);
    }
    this.add(`${base}/compressed_air/header_pressure`, (n) => round(pressure.v + 0.1 * wave(n, 90) + noise(0.03), 2), "bar", 1);
    this.add(`${base}/compressed_air/dew_point`, () => round(3 + noise(0.2), 1), "°C", 10);
    this.add(`${base}/boiler/state`, () => "Running", undefined, 10, true);
    this.add(`${base}/boiler/steam_pressure`, (n) => round(10 + 0.3 * wave(n, 180) + noise(0.05), 2), "bar", 2);
    this.add(`${base}/boiler/water_level`, (n) => round(50 + 6 * wave(n, 240) + noise(0.5), 1), "%", 2);
    this.add(`${base}/boiler/flue_temp`, (n) => round(190 + 6 * wave(n, 600) + noise(0.8), 1), "°C", 5);
    // Nested JSON: boiler diagnostics. Health drops to Warning while compressor 2 is tripped (low instrument air).
    this.add(`${base}/boiler/diagnostics`, (n) => {
      const warn = !!this.fault(`${base}/compressed_air/compressor2`);
      return {
        health: { status: warn ? "Warning" : "OK", score: round(warn ? 71 + noise(2) : 94 + noise(1), 1), message: warn ? "Low instrument air pressure at burner actuator" : "" },
        burner: { flame: "On", firing_rate_pct: round(62 + 8 * wave(n, 180) + noise(1), 1), fuel: { flow: { value: round(41 + 3 * wave(n, 180) + noise(0.4), 1), unit: "m³/h" }, type: "Natural gas" } },
        drum: { pressure: { value: round(10 + 0.3 * wave(n, 180) + noise(0.05), 2), unit: "bar" }, level: { value: round(50 + 6 * wave(n, 240) + noise(0.5), 1), unit: "%" } },
        maintenance: { last_service: "2026-08-14", next_service: "2026-11-14", run_hours: Math.round(4120 + (n - startedAt) / 3_600_000 + 3) },
      };
    }, undefined, 5);
    this.add(`${base}/power/main/active_power`, () => round(load() + noise(8), 1), "kW", 2);
    this.add(`${base}/power/main/energy`, () => round(kwh, 1), "kWh", 10);
    this.add(`${base}/power/main/voltage_l1`, () => round(230 + noise(1.5), 1), "V", 5);
    this.add(`${base}/power/main/power_factor`, () => round(0.94 + noise(0.01), 3), undefined, 10);
    this.add(`${base}/chiller/supply_temp`, (n) => round(6 + 0.4 * wave(n, 900) + noise(0.1), 1), "°C", 5);
    this.add(`${base}/chiller/return_temp`, (n) => round(11 + 0.6 * wave(n, 900) + noise(0.15), 1), "°C", 5);
    this.add(`${base}/chiller/power`, (n) => round(85 + 10 * wave(n, 900) + noise(2), 1), "kW", 5);
    this.add(`${base}/water/flow`, (n) => round(18 + 4 * wave(n, 1200) + noise(0.5), 1), "m³/h", 2);
    this.add(`${base}/water/total`, () => round(water, 1), "m³", 10);
    this.add(`${base}/water/hardness`, () => round(120 + noise(2), 0), "ppm", 30);
  }
}

/* ------------------------------------------------------------------ *
 * In-memory "broker" history: every published message, 3 h rolling.
 * ------------------------------------------------------------------ */
const store = new Map(); // topic -> {topic, unit, ts: number[], v: (number|string)[], numeric, source?}
const docs = new Map(); // JSON document topic -> latest document; its fields live in `store` as <topic>/<path>
const throughput = []; // {ts, count} per second
let totalMsgs = 0;

function record(topic, unit, ts, value, source) {
  let t = store.get(topic);
  if (!t) { t = { topic, unit, ts: [], v: [], numeric: typeof value === "number", source }; store.set(topic, t); }
  t.ts.push(ts); t.v.push(value);
  if (!source) totalMsgs++;
}
/** Leaves of a nested JSON document as [path, value, unit]; an inner {value, unit} object counts as one leaf. */
function flatten(o, path = [], out = []) {
  for (const [k, v] of Object.entries(o)) {
    const p = [...path, k];
    if (v == null) continue;
    if (typeof v === "object" && "value" in v) out.push([p.join("/"), v.value, v.unit]);
    else if (typeof v === "object") flatten(v, p, out);
    else out.push([p.join("/"), typeof v === "boolean" ? String(v) : v, undefined]);
  }
  return out;
}
/** Publishes one tag: a plain value, or a JSON document that is split into field topics. Returns the topics written. */
function emit(tag, now) {
  const v = tag.read(now);
  if (tag.drop?.()) return []; // simulated lost message
  if (!v || typeof v !== "object") { record(tag.topic, tag.unit, now, v); return [tag.topic]; }
  docs.set(tag.topic, { ...v, timestamp: new Date(now).toISOString() });
  totalMsgs++;
  return flatten(v).map(([path, value, unit]) => (record(`${tag.topic}/${path}`, unit, now, value, tag.topic), `${tag.topic}/${path}`));
}
const SEQ_NAME = /^(seq|sequence|seq_no|seqNo|sequence_number)$/;
/** The seq topic covering a topic: itself, or the seq field of the JSON document it is (or belongs to). */
function seqSource(topic) {
  if (SEQ_NAME.test(topic.split("/").pop())) return store.has(topic) ? topic : null;
  const doc = docs.has(topic) ? topic : store.get(topic)?.source;
  if (!doc) return null;
  return ["seq", "sequence", "seq_no", "seqNo", "sequence_number"].map((n) => `${doc}/${n}`).find((t) => store.has(t)) || null;
}
/** Missed messages from jumps in a sequence number (a jump of n = n - 1 lost; a drop back = restart). */
function seqGaps(seqTopic, from, to) {
  const s = slice(store.get(seqTopic), from, to), gaps = [];
  let restarts = 0;

  const t = hover && store.get(hover);
  el.hidden = !t;
  if (!t) return;
  el.innerHTML = `<div class="mono small muted"></div><div class="v"></div><div class="small muted"></div>`;
  el.children[0].textContent = t.topic;
  el.children[1].textContent = fmt(t);
  el.children[2].textContent = `${ratePerMin(t)} msg/min · ${Math.round((Date.now() - lastOf(t).ts) / 1000)} s ago`;
}
/* Trend cards: clicking tags stacks live cards beside the graph, newest first, each with its own range. */
let detailChartAt = 0;
const cardWins = new Map(); // topic -> time window
const MAX_CARDS = 8;
function openCard(topic) { cards = [topic, ...cards.filter((c) => c !== topic)].slice(0, MAX_CARDS); renderDetail(); }
function addToTrends(topics) { picked = [...new Set([...picked, ...topics])].slice(-6); showTab("explorer"); renderTrend(); syncTree(); }
const escHtml = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
/** Pretty-printed, syntax-coloured JSON as HTML. */
function jsonHtml(obj) {
  return escHtml(JSON.stringify(obj, null, 2)).replace(/(&quot;(?:\\.|(?!&quot;).)*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, lit, num) => (str ? `<span class="${colon ? "j-key" : "j-str"}">${str}</span>${colon || ""}` : `<span class="${lit ? "j-lit" : "j-num"}">${m}</span>`));
}
/** Card with the whole latest message of a JSON document topic. */
function rawCard(topic) {
  const d = docs.get(topic), fields = [...store.values()].filter((t) => t.source === topic).length;
  const updated = Date.parse(d.timestamp);
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<div class="card-head"><div class="mono small"></div><button class="icon-btn" data-a="close" aria-label="Close card">✕</button></div>
    <div class="small muted">{ } Raw JSON · ${fields} fields · updated ${Math.max(0, Math.round((Date.now() - updated) / 1000))} s ago</div>
    <pre class="json-view">${jsonHtml(d)}</pre>${seqSource(topic) ? gapSummaryHtml(seqGaps(seqSource(topic), Date.now() - 15 * 60_000, Date.now()), " · last 15 min") : ""}
    <div class="card-foot"><span class="small muted">${ratePerMin(store.get([...store.keys()].find((k) => k.startsWith(topic + "/"))))} msg/min</span><span class="btns"><button class="btn mini" data-a="copy">Copy</button> <button class="btn mini" data-a="ask">Ask</button></span></div>`;
  c.querySelector(".mono").textContent = topic.split("/").slice(-3).join("/");
  c.querySelector(".mono").title = topic;
  c.querySelector('[data-a="close"]').onclick = () => { cards = cards.filter((x) => x !== topic); renderDetail(); };
  c.querySelector('[data-a="copy"]').onclick = (e) => { navigator.clipboard?.writeText(JSON.stringify(docs.get(topic), null, 2)).then(() => { e.target.textContent = "Copied"; setTimeout(() => (e.target.textContent = "Copy"), 1500); }).catch(() => {}); };
  c.querySelector('[data-a="ask"]').onclick = () => { $("input").value = `Summarise the latest ${topic} document and anything unusual in it.`; $("input").focus(); };
  return c;
}
function renderDetail() {
  const el = $("cards");
  cards = cards.filter((c) => store.has(c) || docs.has(c));
  const wasHidden = el.hidden;
  el.hidden = !cards.length;
  if (wasHidden !== el.hidden) { resizeCanvas(); }
  if (!cards.length) return;
  const scroll = el.querySelector(".cards-scroll")?.scrollTop ?? 0;
  el.innerHTML = `<div class="cards-head"><span class="small muted">${cards.length === 1 ? "1 card" : cards.length + " cards"}</span><span class="btns"><button class="btn" data-a="all">Compare all</button><button class="btn" data-a="clear">Clear</button></span></div><div class="cards-scroll"></div>`;
  el.querySelector('[data-a="all"]').onclick = () => addToTrends(cards.filter((c) => store.has(c)));
  el.querySelector('[data-a="clear"]').onclick = () => { cards = []; renderDetail(); };
  const list = el.querySelector(".cards-scroll");
  for (const topic of cards) {
    if (docs.has(topic)) { list.appendChild(rawCard(topic)); continue; }
    const t = store.get(topic);
    if (!cardWins.has(topic)) cardWins.set(topic, makeWin(15));
    const win = cardWins.get(topic), min = win.minutes, { from, to } = win.range();
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="card-head"><div class="mono small"></div><button class="icon-btn" data-a="close" aria-label="Close card">✕</button></div>
      <div class="card-row"><div class="v ${isAlarm(t) ? "bad" : ""}"></div><div class="seg">${[15, 60, 180].map((m) => `<button data-m="${m}" aria-pressed="${win.live && m === min}">${m < 60 ? m + "m" : m / 60 + "h"}</button>`).join("")}</div></div>
      <div class="dchart"></div>
      <div class="card-foot"><span class="small muted"></span><span class="btns">${t.source ? '<button class="btn mini" data-a="raw" title="Show the raw JSON document">{ }</button> ' : ""}<button class="btn mini" data-a="trend">Trends</button> <button class="btn mini" data-a="ask">Ask</button></span></div>`;
    c.querySelector(".mono").textContent = topic.split("/").slice(-3).join("/");
    c.querySelector(".mono").title = topic;
    c.querySelector(".v").textContent = fmt(t);
    c.querySelector(".card-foot .muted").textContent = `${ratePerMin(t)} msg/min${t.source ? " · JSON field" : ""}`;
    c.querySelector('[data-a="close"]').onclick = () => { cards = cards.filter((x) => x !== topic); renderDetail(); };
    c.querySelector('[data-a="trend"]').onclick = () => addToTrends([topic]);
    if (t.source) c.querySelector('[data-a="raw"]').onclick = () => openCard(t.source);
    c.querySelector('[data-a="ask"]').onclick = () => { $("input").value = `What has ${topic} been doing over the last hour?`; $("input").focus(); };
    c.querySelector(".seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { win.setMinutes(Number(b.dataset.m)); renderDetail(); } };
    list.appendChild(c);
    const sq = seqSource(topic), gaps = sq && seqGaps(sq, from, to);
    if (t.numeric) drawChart(c.querySelector(".dchart"), [topic], from, to, 110, (f, tt) => { win.set(f, tt); renderDetail(); }, gaps ? gaps.gaps.map((g) => g.at) : []);
    else drawStates(c.querySelector(".dchart"), [topic], from, to);
    if (gaps) c.querySelector(".dchart").insertAdjacentHTML("afterend", gapSummaryHtml(gaps));
    c.querySelector(".dchart").after(zoomControls(win, renderDetail, true));
  }
  list.scrollTop = scroll;
  detailChartAt = Date.now();
}

/* ------------------------------------------------------------------ *
 * Explorer
 * ------------------------------------------------------------------ */
let picked = [`${ROOT}/packaging/line1/speed`, `${ROOT}/packaging/line2/speed`];
const trendWin = makeWin(60);
const collapsed = new Set();
const rowEls = new Map();
function buildTree() {
  const root = { children: new Map() };
  for (const topic of [...store.keys()].sort()) {
    let node = root;
    topic.split("/").forEach((name, i, parts) => {
      const path = parts.slice(0, i + 1).join("/");
      if (!node.children.has(name)) node.children.set(name, { name, path, children: new Map() });
      node = node.children.get(name);
    });
  }
  const frag = document.createDocumentFragment();
  const walk = (node, depth, parentEl) => {
    for (const c of node.children.values()) {
      const leaf = c.children.size === 0;
      const t = store.get(c.path);
      const b = document.createElement("button");
      b.className = `row ${leaf ? "" : "branch"}`;
      b.style.paddingLeft = `${8 + depth * 14}px`;
      b.dataset.path = c.path;
      b.innerHTML = leaf ? `<span class="dot"></span><span class="name"></span><span class="val"></span>` : `<span class="chev">▾</span><span class="name"></span>`;
      b.querySelector(".name").textContent = c.name;
      parentEl.appendChild(b);
      rowEls.set(c.path, b);
      if (!leaf) {
        const kids = document.createElement("div"); kids.dataset.kids = c.path; parentEl.appendChild(kids);
        walk(c, depth + 1, kids);
      }
    }
  };
  walk(root, 0, frag);
  $("tree").appendChild(frag);
  $("tree").onclick = (e) => {
    const b = e.target.closest(".row"); if (!b) return;
    const p = b.dataset.path, t = store.get(p);
    if (!t) { // branch
      collapsed.has(p) ? collapsed.delete(p) : collapsed.add(p);
      $("tree").querySelector(`[data-kids="${CSS.escape(p)}"]`).hidden = collapsed.has(p);
      b.querySelector(".chev").textContent = collapsed.has(p) ? "▸" : "▾";
      return;
    }
    picked = picked.includes(p) ? picked.filter((x) => x !== p) : [...picked, p].slice(-6);
    syncTree(); renderTrend();
  };
}
function syncTree() {
  const f = $("filter").value.toLowerCase();
  for (const [path, el] of rowEls) {
    const t = store.get(path);
    if (t) {
      const i = picked.indexOf(path);
      el.classList.toggle("picked", i >= 0);
      el.querySelector(".dot").style.background = i >= 0 ? SERIES[i % SERIES.length] : "transparent";
      const v = el.querySelector(".val"); v.textContent = fmt(t); v.classList.toggle("bad", isAlarm(t));
      el.hidden = !!f && !path.toLowerCase().includes(f);
    } else el.hidden = !!f && ![...store.keys()].some((k) => k.startsWith(path + "/") && k.toLowerCase().includes(f));
  }
  $("pick-note").textContent = picked.length ? `${picked.length} of 6 topics · click a topic to add or remove it` : "Click topics to chart them (text topics show as state timelines)";
}
$("filter").oninput = syncTree;
function renderTrend() {
  if ($("view-explorer").hidden) return;
  if (!picked.length) { $("trend").innerHTML = `<div class="empty">Pick topics from the tree to compare their history.</div>`; return; }
  const numeric = picked.filter((t) => store.get(t)?.numeric), text = picked.filter((t) => !numeric.includes(t));
  const { from, to } = trendWin.range();
  $("trend-zoom").replaceChildren(zoomControls(trendWin, renderTrend));
  $("range").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(trendWin.live && Number(x.dataset.min) === trendWin.minutes)));
  if (numeric.length) drawChart($("trend"), numeric, from, to, text.length ? 200 : 260, (f, t) => { trendWin.set(f, t); renderTrend(); });
  else $("trend").innerHTML = "";
  if (text.length) drawStates($("trend"), text, from, to);
}
$("range").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  trendWin.setMinutes(Number(b.dataset.min));
  renderTrend();
};

function showTab(name) {
  const g = name === "graph";
  $("tab-graph").setAttribute("aria-selected", String(g));
  $("tab-explorer").setAttribute("aria-selected", String(!g));
  $("view-graph").hidden = !g; $("view-explorer").hidden = g;
  $("graph-tools").hidden = !g;
  if (g) { resizeCanvas(); setLayout(layout); } else { $("tab-hint").textContent = "Charts refresh every 5 seconds"; syncTree(); renderTrend(); }
}
$("tab-graph").onclick = () => showTab("graph");
$("tab-explorer").onclick = () => showTab("explorer");

/* ------------------------------------------------------------------ *
 * Chat
 * ------------------------------------------------------------------ */
const SUGGESTIONS = [
  "Give me an overview of what's on the broker",
  "Is anything abnormal in the last 30 minutes?",
  "Compare OEE for line 1 and line 2 over the last 3 hours and chart it",
  "When did packaging line 1 last go down, and for how long?",
  "Chart the oven zone temperatures for the last hour",
  "Which motors are running hottest right now?",
  "Have we missed any filler counter messages in the last hour?",
];
let turns = [];
let sample = null, sampleChecked = false, busy = false, ctl = null;
const msgs = $("messages");
function instructions() {
  const topics = [...store.values()].sort((a, b) => a.topic.localeCompare(b.topic)).map((t) => `${t.topic}${t.unit ? ` [${t.unit}]` : ""}${t.numeric ? "" : " (text)"}`).join("\n");
  return `You are the assistant inside an MQTT broker dashboard. Answer questions about what is happening on the broker now and over the recorded history (up to 180 minutes), using the tools to read real data. Never invent values; if the data doesn't show something, say so.

The broker is a Unified Namespace laid out to ISA-95: enterprise/site/area/line/cell/tag. It is a simulated food and beverage plant (packaging lines, mixers, an oven, CIP and utilities) running in the browser, with faults injected now and then. Some topics carry nested JSON documents (MES work orders per line, mixer batch records, a palletizer robot, boiler diagnostics). Each document is split into field topics at <document topic>/<json path>, e.g. acme/dublin/utilities/boiler/diagnostics/drum/pressure, each with its own history: numeric fields work with get_history and get_stats, text fields with get_state_changes, and get_json_document returns a whole document. The filler counter documents (packaging/<line>/filler/counts) carry a seq number per message and some messages are lost on purpose; use check_sequence_gaps for questions about missed or dropped data.

How to work:
- Prefer get_stats and find_anomalies for broad questions, get_history for one signal, get_state_changes for states, alarms and batch phases. Use exact topic names from the list below.
- When a trend or comparison would help, call show_chart; the user sees the chart in the chat.
- Use as few tool calls as you can; you have a limited number of rounds.
- Answer concisely in Markdown: lead with the answer, include key numbers with units and local times, then brief detail. The user's local time zone offset is UTC${-new Date().getTimezoneOffset() / 60 >= 0 ? "+" : ""}${-new Date().getTimezoneOffset() / 60}.

All ${store.size} topics:
${topics}`;
}
function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }
function renderEmpty() {
  msgs.innerHTML = "";
  const box = document.createElement("div"); box.className = "suggest";
  box.innerHTML = `<div class="notice">This demo runs a simulated plant in your browser with 3 hours of backfilled history. Asking Claude uses your own Claude usage and asks your permission the first time.</div>`;
  for (const s of SUGGESTIONS) { const b = document.createElement("button"); b.textContent = s; b.onclick = () => send(s); box.appendChild(b); }
  msgs.appendChild(box);
}
function md(el, text) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(text));
  el.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
}
const ERR = {
  not_granted: "Claude isn't allowed for this page. You can allow it from the artifact's permissions menu.",
  sampling_disabled: "Claude isn't available for this account.",
  rate_limited: "Too many requests right now. Try again in a minute.",
  session_expired: "Your session expired. Sign in again and retry.",
  refused: "Claude declined that request. Try rephrasing it.",
  prompt_too_large: "The conversation got too long. Start a new one with ↺.",
  tools_unavailable: "This viewer can't run the chat's data tools.",
};
async function getSample() {
  if (!sampleChecked) {
    sampleChecked = true;
    try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  }
  return sample;
}
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (msgs.querySelector(".suggest")) msgs.innerHTML = "";
  $("input").value = "";
  const u = document.createElement("div"); u.className = "msg user"; u.textContent = text; msgs.appendChild(u);
  const a = document.createElement("div"); a.className = "msg assistant"; msgs.appendChild(a);
  const status = document.createElement("div"); status.className = "thinking"; status.textContent = "Thinking…"; a.appendChild(status);
  const body = document.createElement("div"); body.className = "md"; a.appendChild(body);
  scrollDown();
  const s = await getSample();
  if (!s) { status.remove(); a.innerHTML = `<div class="err">Chat needs Claude, which this view can't reach. Open the artifact on claude.ai while signed in.</div>`; return; }
  busy = true; setComposer();
  ctl = new AbortController();
  turns.push({ role: "user", content: `[now: ${new Date().toISOString()}]\n${text}` });
  // Charts and tool chips are inserted before the streaming text body.
  chartSink = (c) => {
    const box = document.createElement("div"); box.className = "chat-chart";
    box.innerHTML = `<div class="title"></div><div class="c"></div>`;
    box.querySelector(".title").textContent = c.title;
    a.insertBefore(box, body);
    requestAnimationFrame(() => drawChart(box.querySelector(".c"), c.topics, c.from, c.to, 180));
  };
  const tools = makeTools((name, input) => {
    const chip = document.createElement("div"); chip.className = "chip run";
    chip.innerHTML = "<span></span>"; chip.firstChild.textContent = TOOL_LABEL(name, input);
    a.insertBefore(chip, body); status.textContent = "Reading broker data…"; scrollDown();
    return (ok) => { chip.classList.remove("run"); chip.classList.add(ok ? "done" : "bad"); };
  });
  try {
    const recent = turns.slice(-12);
    const res = await s([{ role: "user", content: instructions() }, ...recent], {
      tools, signal: ctl.signal,
      onText: ({ text }) => { status.remove(); md(body, text); scrollDown(); },
    });
    status.remove();
    md(body, res.text);
    turns.push({ role: "assistant", content: res.text });
    if (res.truncated) { const n = document.createElement("div"); n.className = "small muted"; n.textContent = "Answer cut short. Ask for less at a time."; a.appendChild(n); }
  } catch (e) {
    status.remove();
    if (e && e.text && e.code !== "refused") md(body, e.text);
    else if (e?.code === "refused") body.innerHTML = "";
    turns.pop();
    if (e?.code !== "cancelled") { const er = document.createElement("div"); er.className = "err"; er.textContent = ERR[e?.code] || "Something went wrong reaching Claude. Try again."; a.appendChild(er); }
  } finally {
    chartSink = null; busy = false; ctl = null; setComposer(); scrollDown();
  }
}
function setComposer() {
  const btn = $("send");
  btn.textContent = busy ? "■" : "↑";
  btn.setAttribute("aria-label", busy ? "Stop" : "Send");
  btn.type = busy ? "button" : "submit";
  btn.onclick = busy ? () => ctl?.abort() : null;
}
$("composer").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } };
$("reset").onclick = () => { ctl?.abort(); turns = []; renderEmpty(); };

/* ------------------------------------------------------------------ *
 * Boot
 * ------------------------------------------------------------------ */
buildTree();
renderEmpty();
resizeCanvas();
fitGraph();
renderTopbar();
window.addEventListener("resize", () => { resizeCanvas(); renderTrend(); });
new ResizeObserver(() => { const w = W; resizeCanvas(); if (!w || Math.abs(w - W) > 40) fitGraph(); }).observe($("graph-main"));
setInterval(() => {
  liveTick();
  renderTopbar();
  if (!$("view-explorer").hidden) syncTree();
  if (hover) renderHover();
  if (cards.length && Date.now() - detailChartAt > 5000) renderDetail();
  if (keep) applyTreeFilter(false); // values change, so value matches can too
}, 1000);
setInterval(renderTrend, 5000);
(function loop() { if (!$("view-graph").hidden) drawGraph(); requestAnimationFrame(loop); })();
</script>
